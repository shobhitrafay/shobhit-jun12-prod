apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: shobhit-aws-prod
  project: shobhit
spec:
  blueprintConfig:
    name: minimal
    version: 2.3.0
  cloudCredentials: aws
  config:
    addons:
    - name: aws-ebs-csi-driver
      version: latest
    managedNodeGroups:
    - amiFamily: AmazonLinux2
      desiredCapacity: 2
      iam:
        withAddonPolicies:
          autoScaler: true
      instanceTypes:
      - t3.xlarge
      maxSize: 2
      minSize: 0
      name: managed-ng-1
      version: "1.29"
      volumeSize: 80
      volumeType: gp3
    metadata:
      name: shobhit-aws-prod
      region: us-west-2
      tags:
        email: shobhit@rafay.co
        env: qa
      version: "1.29"
    network:
      cni:
        name: aws-cni
        params:
          customCniCidr: 100.0.0.0/16
    vpc:
      cidr: 192.168.0.0/16
      clusterEndpoints:
        privateAccess: true
        publicAccess: false
      nat:
        gateway: Single
  proxyConfig: {}
  type: aws-eks
