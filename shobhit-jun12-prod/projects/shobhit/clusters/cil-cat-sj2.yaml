          networkProfile:
            dnsServiceIP: 10.0.0.10
            loadBalancerSku: standard
            networkPlugin: none
            podCidr: 10.244.0.0/16
            serviceCidr: 10.0.0.0/16
          nodeProvisioningProfile:
            defaultNodePools: Auto
            mode: Auto
          powerState:
            code: Running
          serviceMeshProfile:
            istio:
              certificateAuthority:
                plugin:
                  certChainObjectName: ca-cert
                  certObjectName: ca-cert-test
                  keyObjectName: ca-key
                  keyVaultID: /subscriptions/a2252eb2-7a25-432b-a5ec-e18eba6f26b1/resourceGroups/shobhit-rg/providers/Microsoft.KeyVault/vaults/shobhit-keyvault
                  rootCertObjectName: root-cert
              components:
                ingressGateways:
                - enabled: true
                  mode: External
              revisions:
              - asm-1-28
            mode: Istio
        sku:
          name: Base
          tier: Free
        tags:
          env: qa
        type: Microsoft.ContainerService/managedClusters
      nodePools:
      - apiVersion: "2025-10-01"
        name: primary
        properties:
          count: 3
          maxPods: 110
          mode: System
          orchestratorVersion: 1.33.1
          osType: Linux
          vmSize: Standard_DS2_v2
          vnetSubnetID: /subscriptions/a2252eb2-7a25-432b-a5ec-e18eba6f26b1/resourceGroups/shobhit-fnf-nw-rg/providers/Microsoft.Network/virtualNetworks/shobhit-fnf-vnet/subnets/default
