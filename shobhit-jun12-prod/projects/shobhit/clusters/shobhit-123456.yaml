apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  labels:
    App: rafay-managed-cluster
    Env: Rafay-test
    asd: sa
  name: shobhit-123456
  project: shobhit
spec:
  blueprintConfig:
    name: minimal
  cloudCredentials: aws-cred-shobhit-raut
  config:
    addons:
    - name: coredns
      version: latest
    - name: kube-proxy
      version: latest
    - name: vpc-cni
      version: latest
    - name: aws-ebs-csi-driver
      version: latest
    - name: eks-pod-identity-agent
      version: latest
    iam:
      serviceAccounts: []
      withOIDC: true
    managedNodeGroups:
    - amiFamily: AmazonLinux2
      desiredCapacity: 2
      disableIMDSv1: false
      disablePodIMDS: false
      ebsOptimized: false
      efaEnabled: false
      enableDetailedMonitoring: false
      iam:
        withAddonPolicies:
          albIngress: false
          appMesh: false
          appMeshPreview: false
          autoScaler: true
          certManager: false
          cloudWatch: false
          ebs: false
          efs: false
          externalDNS: false
          fsx: false
          imageBuilder: true
          xRay: false
      instanceType: t3.xlarge
      labels:
        app: infra
        dedicated: "true"
      maxPodsPerNode: 50
      maxSize: 3
      minSize: 1
      name: ng-1
      privateNetworking: true
      spot: false
      tags:
        aasdas: asdasd
        email: shobhit@rafay.co
        env: qa
        sadas: adsas
        sharan: check
      version: "1.30"
      volumeEncrypted: false
      volumeIOPS: 3000
      volumeSize: 80
      volumeThroughput: 125
      volumeType: gp3
    metadata:
      name: shobhit-123456
      region: us-east-1
      tags:
        email: shobhit@rafay.co
        env: qa
      version: "1.30"
    network:
      cni:
        name: aws-cni
    vpc:
      autoAllocateIPv6: false
      cidr: 192.168.0.0/16
      clusterEndpoints:
        privateAccess: true
        publicAccess: true
      nat:
        gateway: Single
  type: aws-eks
