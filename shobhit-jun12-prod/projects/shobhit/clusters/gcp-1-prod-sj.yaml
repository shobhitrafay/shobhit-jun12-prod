apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  labels:
    schedule: donotstop
  name: gcp-1-prod-sj
  project: shobhit
spec:
  blueprint:
    name: minimal
    version: latest
  cloudCredentials: gke-dev
  config:
    controlPlaneVersion: "1.35"
    features:
      enableComputeEnginePersistentDiskCSIDriver: true
    gcpProject: dev-382813
    location:
      config:
        zone: us-central1-b
      type: zonal
    network:
      access:
        config: null
        type: public
      dataPlaneV2: ADVANCED_DATAPATH
      enableVPCNativetraffic: true
      maxPodsPerNode: 110
      name: default
      subnetName: default
    nodePools:
    - machineConfig:
        bootDiskSize: 100
        bootDiskType: pd-standard
        imageType: COS_CONTAINERD
        machineType: e2-standard-4
      management:
        autoUpgrade: true
      name: default-nodepool
      nodeVersion: "1.34"
      resourceLabels:
        schedule: donotstop
      security:
        workloadMetadataMode: gce_metadata
      size: 3
      upgradeSettings:
        config:
          maxSurge: 1
        strategy: SURGE
    - machineConfig:
        bootDiskSize: 100
        bootDiskType: pd-standard
        imageType: COS_CONTAINERD
        machineType: e2-standard-4
      management:
        autoUpgrade: true
      metadata:
        gceInstanceMetadata:
        - key: schedule
          value: donotstop
      name: a1
      nodeVersion: "1.35"
      security:
        workloadMetadataMode: gke_metadata
      size: 3
      upgradeSettings:
        config:
          maxSurge: 1
        strategy: SURGE
    releaseChannel:
      channel: REGULAR
    resourceLabels:
      schedule: donotstop
    security:
      enableWorkloadIdentity: true
  type: gke
