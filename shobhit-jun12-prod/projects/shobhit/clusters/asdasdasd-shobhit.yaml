apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: asdasdasd-shobhit
  project: shobhit
spec:
  blueprintConfig:
    name: minimal
    version: Latest
  cloudCredentials: aws
  config:
    addons:
    - name: aws-ebs-csi-driver
      version: latest
    managedNodeGroups:
    - amiFamily: AmazonLinux2
      desiredCapacity: 2
      iam:
        instanceRoleARN: arn:aws:iam::679196758854:role/rafay-eks-cluster-11-nodegroup-ng--NodeInstanceRole-192SYhtu5EoT
      instanceTypes:
      - t3.xlarge
      maxSize: 2
      minSize: 2
      name: managed-ng-1
      version: "1.27"
      volumeSize: 80
      volumeType: gp3
    metadata:
      name: asdasdasd-shobhit
      region: us-west-2
      tags:
        email: shobhit@rafay.co
        env: qa
      version: "1.27"
    network:
      cni:
        name: aws-cni
    vpc:
      cidr: 192.168.0.0/16
      clusterEndpoints:
        privateAccess: true
        publicAccess: false
      nat:
        gateway: Single
  proxyConfig: {}
  type: aws-eks
