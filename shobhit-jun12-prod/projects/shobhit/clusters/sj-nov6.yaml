apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: sj-nov6
  project: shobhit
spec:
  blueprint:
    name: minimal
    version: latest
  cloudCredentials: gke-dev
  config:
    controlPlaneVersion: "1.34"
    features:
      enableComputeEnginePersistentDiskCSIDriver: true
    gcpProject: dev-382813
    location:
      config:
        zone: us-east1-c
      type: zonal
    network:
      access:
        config: null
        type: public
      dataPlaneV2: ADVANCED_DATAPATH
      enableVPCNativetraffic: true
      maxPodsPerNode: 110
      name: default
      subnetName: default
    nodePools:
    - machineConfig:
        bootDiskSize: 100
        bootDiskType: pd-standard
        imageType: COS_CONTAINERD
        machineType: e2-standard-4
      management:
        autoUpgrade: true
      name: default-nodepool
      nodeVersion: "1.34"
      size: 3
      upgradeSettings:
        config:
          maxSurge: 1
        strategy: SURGE
    releaseChannel:
      channel: REGULAR
  type: gke
